# Features shown on the home page, in this order.
#
#   id:          unique, used as the card's anchor (#feature-<id>)
#   title:       a few words
#   category:    game | server | webui | patcher | tooling (sets the filter tab and the colour)
#   description: one or two sentences
#   image:       optional, path relative to this file (PNG, JPG or WebP; Astro optimizes it)
#   alt:         what the image shows, for screen readers (with image)
#   wide:        optional, true makes the card span two columns
#   link:        optional, { label, href } shown under the description

- id: worlds
  title: The worlds are back
  category: game
  description: >-
    LEGO Center, the starting worlds and every dungeon load with their enemies, smashables,
    buildies and portals, from data extracted from the shipped client.
  image: ./images/enchanted-forest.jpg
  alt: A minifigure on the icy cliffs of the Enchanted Forest
  wide: true

- id: combat
  title: Combat and abilities
  category: game
  description: >-
    Attacks, specials and channelled abilities run the client's own spell action lists. Enemies
    pick spells, keep their distance, chase and leash; bosses have arenas.
  image: ./images/combat.jpg
  alt: A special attack's burst in the middle of LEGO Center's plaza, among test enemies

- id: minifigures
  title: Minifigures and the team
  category: game
  description: >-
    Collect minifigures, swap the team of three, rank them up with stars and buy upgrades in the
    Item Shop. Optional progression from level 1, or everyone at level 30.

- id: upgrades
  title: Upgrades
  category: game
  description: >-
    Spend stars on each minifigure's upgrade tree in the Collection: more health, faster
    attacks, and procs such as Lionhearted after a special attack.
  image: ./images/upgrades.jpg
  alt: The Roman Commander's upgrade tree with the Lionhearted upgrade for 150 stars

- id: multiplayer
  title: Multiplayer
  category: game
  description: >-
    Play together on one server: see other players move and fight in real time, in the same
    worlds or in copies of their own.
  image: ./images/multiplayer.jpg
  alt: Two players fighting a pack of enemies together on the Isle of Yarr

- id: friends
  title: Friends
  category: game
  description: >-
    Add friends from the Team List or with friend codes, accept invitations, and see who is
    online.
  image: ./images/friend-accept.jpg
  alt: An invitation from Fantastic Sparky Burrito to be friends, with No and Yes buttons

- id: teams
  title: Teams
  category: game
  description: >-
    Invite friends to a team: teammates share kills, smashes and pocket world clears, and see
    each other on the map.
  image: ./images/join-teams.jpg
  alt: The message "You joined a group" after inviting a friend to a team

- id: dialogues
  title: Story and dialogues
  category: game
  description: >-
    The characters talk again: story conversations, cinematics and quest lines, with the
    recorded texts of the live game.
  image: ./images/dialogues.jpg
  alt: The Jester asking the player to deliver the stolen crown

- id: area-quests
  title: Area quests
  category: game
  description: >-
    Each world's quests show in the tracker: rescue minifigures, travel, collect airplane parts
    and test your mettle in the Gauntlet.
  image: ./images/area-quests.jpg
  alt: The quest tracker in Dinosaur Rise listing four quests next to a fight

- id: achievements
  title: Achievements
  category: game
  description: >-
    Defeats, clears, finds and collections earn achievements, with the live game's pop-ups, the
    achievement journal and the lore tree.
  image: ./images/achievements.jpg
  alt: The Quest Completed pop-up for Battle Mech, the Lost Challenger

- id: lost-creations
  title: Lost Creations
  category: game
  description: >-
    Timed runs through the Lost Creations levels in the Gatekeeper's Realm, up to the Gatekeeper
    himself.
  image: ./images/lost-creations.jpg
  alt: Fighting the Gatekeeper in his arena with the level timer showing 04:53
  wide: true

- id: chat
  title: Chat channels and tells
  category: game
  description: >-
    Local, channel and private chat, with server lines from "Server". GMs type ! commands into
    the chat to teleport, spawn test fights and solve puzzles.
  image: ./images/chat.png
  alt: General chat with a message from another player and a reply

- id: dungeons
  title: Dungeons, bosses and loot
  category: game
  description: >-
    Ambushes, champion spots and boss arenas from the client's own area data, with loot drops,
    achievements and the lore tree.
  image: ./images/dungeon-loot.jpg
  alt: Treasure chests in Space Command HQ, one dropping Carpenter Legs

- id: puzzles
  title: Gates, plates and mirrors
  category: game
  description: >-
    Light gates, pressure plates and Medusa mirror puzzles open the way through the Armory and
    the Gauntlet.
  image: ./images/puzzles.jpg
  alt: Beams of light crossing the Armory's floor between mirrors
  wide: true

- id: native-linux
  title: The native Linux client
  category: server
  description: >-
    The 2016 Linux build runs again with a small patch kit; the Windows client runs under Wine
    or Proton. Both connect to the same server.
  image: ./images/native-linux-client.jpg
  alt: The carnival corner of LEGO Center in the native Linux client
  wide: true

- id: webui-console
  title: Web console for staff
  category: webui
  description: >-
    Accounts, characters, bans and kicks, broadcasts, maintenance mode, API keys and an audit
    log of every administrative action, scoped by GM level.
  image: ./images/webui-accounts.png
  alt: The accounts list of the web console, with admin, moderator and banned badges
  wide: true
  link:
    label: REST API reference
    href: https://github.com/LMOxide/lmoxide/blob/main/docs/API.md

- id: webui-characters
  title: Characters in detail
  category: webui
  description: >-
    Every character's location, level, team, minifigure ranks and upgrades, and the tokens they
    have gained and spent.
  image: ./images/webui-character.png
  alt: A character page listing the team, ranks, upgrades and tokens

- id: webui-moderation
  title: Moderation
  category: webui
  description: >-
    Timed bans with reasons, kicks, password resets and account edits. Moderators can ban
    players; only admins can touch staff.
  image: ./images/webui-moderation.png
  alt: A banned account with Kick, Unban, Edit, Password and Delete buttons

- id: webui-audit
  title: Audit log
  category: webui
  description: >-
    Who did what, to whom and why: logins, bans, broadcasts, API keys and account changes,
    newest first.
  image: ./images/webui-audit.png
  alt: The audit log listing logins, bans and broadcasts

- id: patcher
  title: One-click patcher
  category: patcher
  description: >-
    Install, update, verify and repair the client from any LMOxide server, then start it already
    logged in. Profiles for several servers, accounts and Wine setups.
  image: ./images/patcher-ready.png
  alt: The patcher window showing Ready to play

- id: patcher-trust
  title: Signed manifests
  category: patcher
  description: >-
    Every file is checked against an ed25519-signed manifest. The patcher asks before trusting a
    new server and warns if its key ever changes.
  image: ./images/patcher-trust.png
  alt: The patcher asking whether to trust a server's signing key

- id: patcher-updates
  title: Incremental updates
  category: patcher
  description: >-
    Only files that differ are downloaded, in parallel, and interrupted downloads resume. The
    patcher updates itself from the same server.
  image: ./images/patcher-install.png
  alt: The patcher before a first install, with the download size

- id: test-bots
  title: Scripted test runs
  category: tooling
  description: >-
    The server can drive a client through test commands, screenshot tours of every boss or
    buildie, and headless login probes, so changes are checked in the real game.
  image: ./images/bot-moving.png
  alt: Three frames of a character walking on its own
  wide: true
